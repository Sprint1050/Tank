	<!DOCTYPE html>
<html lang="en">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Tanks">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="my-tanks-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tanks</title>

<style>
:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#0f172a;
  --sub:#6b7280;
  --accent:#2563eb;
  --accent2:#1d4ed8;
  --bar:#22c55e;
}

.status-green{ color:#16a34a; }
.status-orange{ color:#f59e0b; }
.status-red{ color:#dc2626; }

body.dark{
  --bg:#0b1220;
  --card:#111827;
  --text:#e5e7eb;
  --sub:#9ca3af;
  --accent:#3b82f6;
  --accent2:#2563eb;
  --bar:#22c55e;
}

body{
  margin:0;
  max-width:420px;
  margin-left:auto;
  margin-right:auto;
  font-family:-apple-system;
  background:var(--bg);
  padding-bottom:80px;   /* ⭐ ADD THIS */
}

h1{
  text-align:center;
  font-weight:700;
  margin:10px 0 20px 0;
}

.card{
  backdrop-filter: blur(6px);
  background:var(--card);
  padding:18px;
  border-radius:18px;
  margin-bottom:16px;
  box-shadow:0 15px 35px rgba(0,0,0,0.08);
}

.label{
  font-size:14px;
  color:var(--sub);
  margin-bottom:6px;
}

#statusText{
  white-space: pre-line;
  transition: all 0.35s ease;
}

#rainResult{
  white-space: pre-line;
}

.status-animate{
  opacity: 0;
  transform: translateY(6px);
}

.big-input{
  width:100%;
  font-size:34px;
  padding:12px;
  text-align:center;
  border-radius:14px;
  border:1px solid #e5e7eb;
}

body.dark .big-input{
  background:#0b1220;
  border:1px solid #1f2937;
  color:white;
}

button{
  transition: transform 0.08s ease, box-shadow 0.08s ease;
  box-shadow: 0 10px 20px rgba(37,99,235,0.25);
  width:100%;
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:14px;
  background:linear-gradient(45deg,var(--accent),var(--accent2));
  color:white;
  margin-top:12px;
  font-weight:600;
}

.progress{
  height:28px;
  background:#e5e7eb;
  border-radius:20px;
  margin-top:14px;
  position:relative;
  overflow:hidden;
}

body.dark .progress{
  background:#1f2937;
}

.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#34d399,var(--bar));
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
}

.progress span{
  position:absolute;
  width:100%;
  text-align:center;
  line-height:28px;
  font-weight:700;
  font-size:14px;
}

.nav{
  height:60px;
  box-shadow:0 -5px 20px rgba(0,0,0,0.08);
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  border-top:1px solid #e5e7eb;
  background:var(--card);
}

body.dark .nav{
  border-top:1px solid #1f2937;
}

.nav button{
  flex:1;
  background:var(--card);
  color:var(--text);
  font-weight:600;
}
.nav button.active{
  color: var(--accent);
  font-weight:700;
  transform: translateY(-2px);
}
button:active{
  transform: scale(0.97);
  box-shadow: 0 5px 10px rgba(37,99,235,0.2);
}

.toggle{
  text-align:center;
  font-size:13px;
  color:var(--sub);
  margin-top:8px;
}

.usage-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.usage-grid label{
  font-size:13px;
  color:var(--sub);
}
.usage-grid input{
  box-sizing:border-box;
  width:100%;
  margin-top:5px;
  padding:10px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  font-size:16px;
  background:var(--card);
  color:var(--text);
}
body.dark .usage-grid input{
  background:#0b1220;
  border:1px solid #1f2937;
  color:white;
}
.usage-total{
  margin-top:12px;
  font-weight:700;
  font-size:16px;
}


/* LEVEL DASHBOARD */
.level-card{padding:18px 16px 16px;overflow:hidden;}
.level-dashboard{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px;align-items:center;}
.level-heading{font-size:24px;color:var(--sub);font-weight:600;letter-spacing:.1px;margin-bottom:2px;}
.level-litres{font-size:52px;line-height:1;margin:0 0 16px;font-weight:800;letter-spacing:-1.8px;color:var(--text);}
.level-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.metric{min-height:72px;border-radius:16px;padding:10px 9px;display:flex;align-items:center;gap:7px;box-sizing:border-box;}
.metric-blue{background:#eaf6ff;}
.metric-grey{background:#f4f6f9;}
.metric-icon{font-size:30px;line-height:1;color:#2563eb;min-width:30px;text-align:center;}
.metric-grey .metric-icon{color:#64748b;font-size:32px;}
.metric-value{font-size:25px;line-height:1.05;font-weight:800;color:#0f172a;white-space:nowrap;}
.metric-blue .metric-value{color:#2563eb;}
.metric-label{font-size:12px;line-height:1.15;margin-top:4px;color:#64748b;font-weight:800;letter-spacing:.4px;}
.level-details{margin-top:12px;border-top:1px solid #e5e7eb;}
.detail-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #e5e7eb;font-size:14px;color:var(--sub);}
.detail-row:last-child{border-bottom:0;}
.detail-row strong{color:var(--text);font-size:15px;white-space:nowrap;}
.detail-icon{display:inline-block;width:25px;margin-right:4px;color:#3b82f6;font-weight:800;font-size:20px;vertical-align:-2px;text-align:center;}
.days-bar{margin-top:10px;border-radius:14px;padding:10px 11px;display:grid;grid-template-columns:auto 1px minmax(0,1fr);align-items:center;gap:9px;color:white;transition:background .25s ease;}
.days-green{background:#16a34a;}
.days-orange{background:#f59e0b;}
.days-red{background:#dc2626;}
.days-main{display:flex;align-items:center;gap:7px;white-space:nowrap;}
.days-main strong{font-size:17px;line-height:1.05;}
.days-icon{font-size:21px;line-height:1;}
.days-divider{height:28px;background:rgba(255,255,255,.55);}
.days-date{font-size:12px;line-height:1.25;font-weight:700;min-width:0;}
.tank-visual{width:150px;height:250px;position:relative;margin:auto;display:flex;align-items:flex-end;justify-content:center;}
.tank-lid{position:absolute;top:7px;width:92px;height:18px;border-radius:50% 50% 25% 25%;background:linear-gradient(180deg,#8da0b4,#52657b);box-shadow:0 3px 5px rgba(15,23,42,.18);z-index:3;}
.tank-body{position:relative;width:126px;height:214px;border-radius:34px 34px 22px 22px;background:linear-gradient(90deg,#dbe5ef 0%,#f8fbfd 25%,#d4dfeb 70%,#aebdcd 100%);border:2px solid #9eafc0;overflow:hidden;box-shadow:inset 10px 0 18px rgba(255,255,255,.35),inset -10px 0 15px rgba(71,85,105,.12),0 7px 12px rgba(15,23,42,.12);}
.tank-body:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.28);transform:translateX(-50%);z-index:2;}
.tank-water{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(180deg,#54c8f7,#1497df 55%,#0876c9);transition:height .55s ease;z-index:1;}
.tank-water:before{content:"";position:absolute;left:-4%;right:-4%;top:-5px;height:12px;border-radius:50%;background:rgba(76,201,240,.92);box-shadow:0 2px 4px rgba(0,0,0,.08);}
.tank-rib{position:absolute;left:0;right:0;height:3px;background:rgba(83,102,122,.16);z-index:3;}
.rib-1{top:20%;}.rib-2{top:38%;}.rib-3{top:56%;}.rib-4{top:74%;}.rib-5{top:88%;}
.tank-percent{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:4;text-align:center;color:white;font-size:21px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.25);}
.tank-percent span{display:block;font-size:12px;letter-spacing:.5px;margin-top:2px;}
body.dark .metric-blue{background:#10263a;}
body.dark .metric-grey{background:#18202c;}
body.dark .metric-value{color:#e5e7eb;}
body.dark .metric-blue .metric-value{color:#60a5fa;}
body.dark .level-details{border-top-color:#1f2937;}
body.dark .detail-row{border-bottom-color:#1f2937;}
body.dark .detail-row strong{color:#e5e7eb;}
body.dark .tank-body{background:linear-gradient(90deg,#536477 0%,#9aabba 30%,#637589 75%,#425368 100%);border-color:#334155;}
@media (max-width:380px){
  .level-dashboard{grid-template-columns:minmax(0,1fr) 125px;gap:8px;}
  .tank-visual{width:125px;height:220px;}
  .tank-body{width:106px;height:190px;}
  .level-litres{font-size:46px;}
  .metric-value{font-size:21px;}
  .metric-icon{font-size:25px;min-width:25px;}
  .detail-row{font-size:13px;}
  .detail-row strong{font-size:14px;}
}


/* MOBILE LEVEL CARD FIX
   On narrow screens the dashboard becomes a single clean column.
   This prevents the percentage/water-height tiles and tank graphic
   from colliding or becoming compressed.
*/
@media (max-width:600px){
  .level-card{
    padding:18px 16px 16px;
  }

  .level-dashboard{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    align-items:start;
  }

  .level-heading{
    font-size:24px;
    margin-bottom:4px;
  }

  .level-litres{
    font-size:50px;
    margin-bottom:16px;
  }

  .level-metrics{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .metric{
    min-height:86px;
    padding:12px 10px;
    gap:8px;
  }

  .metric-icon{
    font-size:28px;
    min-width:28px;
  }

  .metric-grey .metric-icon{
    font-size:30px;
  }

  .metric-value{
    font-size:24px;
  }

  .metric-label{
    font-size:12px;
  }

  .level-details{
    margin-top:14px;
  }

  .detail-row{
    padding:10px 0;
    font-size:15px;
  }

  .detail-row strong{
    font-size:16px;
  }

  .days-bar{
    margin-top:12px;
    padding:11px 12px;
  }

  .days-main strong{
    font-size:17px;
  }

  .days-date{
    font-size:12px;
  }

  .tank-visual{
    width:170px;
    height:260px;
    margin:4px auto 0;
  }

  .tank-body{
    width:136px;
    height:224px;
  }

  .tank-lid{
    width:100px;
  }

  .tank-percent{
    font-size:22px;
  }
}

@media (max-width:380px){
  .level-litres{
    font-size:46px;
  }

  .metric{
    min-height:82px;
  }

  .metric-value{
    font-size:21px;
  }

  .metric-icon{
    font-size:25px;
    min-width:25px;
  }

  .tank-visual{
    width:155px;
    height:240px;
  }

  .tank-body{
    width:124px;
    height:207px;
  }
}


/* FINAL LEVEL CARD UPGRADE */
.dashboard-hidden-value{display:none!important;}
.level-card{padding:18px 16px 16px;overflow:hidden;}
.level-top-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:end;padding:0 2px 4px;}
.level-summary,.space-summary{min-width:0;}
.level-heading,.space-heading{font-size:18px;color:var(--sub);font-weight:600;line-height:1.15;margin-bottom:5px;}
.level-litres{font-size:46px;line-height:1;font-weight:800;letter-spacing:-1.6px;color:var(--text);margin:0;}
.space-summary{text-align:right;border-left:1px solid #e5e7eb;padding-left:18px;}
.space-value{display:block;font-size:30px;line-height:1.05;font-weight:800;color:var(--text);white-space:nowrap;}
.tank-visual-large{width:100%;height:300px;margin:8px auto 4px;}
.tank-visual-large .tank-body{width:175px;height:260px;border-radius:42px 42px 26px 26px;}
.tank-visual-large .tank-lid{width:118px;height:22px;}
.tank-visual-large .tank-percent{font-size:25px;}
.days-bar{margin-top:8px;border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto 1px minmax(0,1fr);align-items:center;gap:10px;background:#08a63d;color:#fff;}
.days-main strong{font-size:18px;line-height:1.05;text-transform:uppercase;}
.days-date{font-size:13px;line-height:1.25;font-weight:700;min-width:0;color:#fff;}
.level-details{margin-top:10px;border-top:1px solid #e5e7eb;}
.detail-row{padding:10px 0;font-size:14px;}
.detail-row strong{font-size:16px;}
.save-reading-compact{display:block!important;width:78%!important;margin:12px auto 10px!important;padding:10px 14px!important;font-size:17px!important;min-height:0!important;border-radius:12px!important;}
#lowWarning{margin-top:2px;}
@media (max-width:600px){
  .level-card{padding:18px 16px 14px;}
  .level-top-grid{gap:12px;padding-bottom:2px;}
  .level-heading,.space-heading{font-size:17px;}
  .level-litres{font-size:43px;}
  .space-summary{padding-left:12px;}
  .space-value{font-size:26px;}
  .tank-visual-large{height:285px;margin-top:8px;}
  .tank-visual-large .tank-body{width:168px;height:250px;}
  .tank-visual-large .tank-lid{width:112px;}
  .tank-visual-large .tank-percent{font-size:23px;}
  .days-bar{padding:11px 12px;gap:8px;}
  .days-main strong{font-size:17px;}
  .days-date{font-size:12px;}
  .save-reading-compact{width:72%!important;font-size:16px!important;}
}
@media (max-width:380px){
  .level-litres{font-size:39px;}
  .space-value{font-size:23px;}
  .tank-visual-large{height:260px;}
  .tank-visual-large .tank-body{width:150px;height:230px;}
  .tank-visual-large .tank-lid{width:100px;}
}


/* APPROVED TANK GRAPHIC — locked visual reference */
.approved-tank-visual{position:relative;width:100%;height:auto;margin:4px auto 2px;display:flex;justify-content:center;align-items:center;overflow:hidden;}
.approved-tank-visual img{display:block;width:100%;max-width:700px;height:auto;object-fit:contain;object-position:center;filter:none;}
.approved-tank-overlay{position:absolute;left:50%;top:73%;transform:translate(-50%,-50%);display:flex!important;align-items:center;justify-content:center;width:auto;min-width:0;max-width:none;height:auto;border-radius:0;background:transparent;box-shadow:none;padding:0;pointer-events:none;z-index:5;}
.approved-tank-percent{position:static;transform:none;font-size:25px;line-height:1.05;font-weight:800;color:#fff;text-align:center;background:transparent;padding:0;border-radius:0;text-shadow:0 1px 3px rgba(0,0,0,.25);box-shadow:none;}
.approved-tank-percent span{display:block;font-size:13px;margin-top:3px;letter-spacing:.3px;}
/* Keep the calculation engine's original tank elements available without displaying the old graphic. */
.legacy-tank-engine{display:none!important;}
@media(max-width:600px){.approved-tank-visual{height:auto}}
@media(max-width:380px){.approved-tank-visual{height:auto}}

.engine-input{position:absolute;left:-99999px;width:1px;height:1px;overflow:hidden;}
.reading-compact-wrap{margin-top:12px;padding-top:2px;}
.reading-label{font-size:15px;color:var(--sub);margin-bottom:7px;}
.reading-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;}
.reading-input-wrap{height:52px;border:1.5px solid #dbe2ec;border-radius:14px;background:#fff;display:flex;align-items:center;overflow:hidden;}
.reading-input-wrap input{width:100%;height:100%;border:0;outline:0;padding:0 14px;font-size:26px;font-weight:800;color:var(--text);background:transparent;box-sizing:border-box;}
.reading-input-wrap span{height:30px;display:flex;align-items:center;padding:0 13px;border-left:1px solid #dbe2ec;color:#64748b;font-size:16px;}
.save-reading-compact{width:auto!important;margin:0!important;height:52px;padding:0 18px!important;border-radius:14px!important;font-size:16px!important;white-space:nowrap;background:#1683f7!important;color:#fff!important;border:0!important;font-weight:800;}
.last-saved{font-size:12px;color:var(--sub);margin-top:6px;}
@media(max-width:600px){.reading-row{grid-template-columns:minmax(0,1fr) auto;gap:8px}.save-reading-compact{padding:0 14px!important;font-size:15px!important}.reading-input-wrap input{font-size:24px}.reading-label{font-size:14px;}}
</style>


<style id="mobile-fit-fix">
*, *::before, *::after { box-sizing: border-box; }
.level-details,
.detail-row,
.reading-compact-wrap,
.reading-row,
.reading-input-wrap,
.save-reading-compact { min-width: 0; max-width: 100%; }

.detail-row { width: 100%; }
.detail-row > span { min-width: 0; }
.detail-row > strong { flex: 0 0 auto; }

.reading-row {
  width: 100%;
  grid-template-columns: minmax(0, 1fr) minmax(0, 42%);
  gap: 8px;
}

.reading-input-wrap { width: 100%; }
.reading-input-wrap input { min-width: 0; width: 100%; }

.save-reading-compact {
  width: 100% !important;
  min-width: 0 !important;
  padding-left: 10px !important;
  padding-right: 10px !important;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

@media (max-width: 430px) {
  .level-details { width: 100%; }
  .detail-row { padding-left: 0; padding-right: 0; }
  .reading-row { grid-template-columns: minmax(0, 1fr) minmax(0, 41%); gap: 7px; }
  .save-reading-compact { font-size: 14px !important; padding-left: 8px !important; padding-right: 8px !important; }
}
</style>

</head>

<body>

<h1>💧 My Water Tank</h1>

<!-- HOME -->
<div id="home" class="screen">
<div class="engine-input" aria-hidden="true">
    <input id="waterLevel" type="number" inputmode="decimal" value="0" placeholder="Enter level">
    <div class="progress"><div class="bar" id="bar"></div><span id="percent">0%</span></div>
  </div>

  <div class="card level-card">
    <div class="level-top-grid">
      <div class="level-summary">
        <div class="level-heading">Level</div>
        <h2 id="litres" class="level-litres">0 L</h2>
      </div>
      <div class="space-summary">
        <div class="space-heading">Space Available</div>
        <strong id="spaceAvailableDisplay" class="space-value">0 L</strong>
      </div>
    </div>

    <!-- Calculation-support values remain in the engine but are not duplicated in the dashboard. -->
    <span id="levelPercent" class="dashboard-hidden-value">0.0%</span>

<script>
window.onload = () => {
  const input = document.getElementById("waterLevel");
  if(input) input.focus();
  document.getElementById("tab-home").classList.add("active");
  loadDailyUsage();
  // Start the current reading at the HTML default of 0.
  // Historical readings remain stored for the Graph/Intel, but they do not
  // automatically replace today's current reading.
  if(input) input.value = "0";
  const visible = document.getElementById("waterLevelVisible");
  if(visible) visible.value = "0";
  calculate();
};


// DAILY USAGE
const usageFields = [
  "Showers","Toilets","Laundry","Kitchen","Garden","Cleaning","Other"
];

function getDailyUsageValues(){
  return usageFields.map(name =>
    parseFloat(document.getElementById("usage" + name).value) || 0
  );
}

function getManualDailyUsage(){
  const values = getDailyUsageValues();
  const total = values.reduce((sum, value) => sum + value, 0);
  return total > 0 ? total : 0;
}

function updateDailyUsageTotal(){
  const total = getManualDailyUsage();
  const el = document.getElementById("usageTotal");
  if(el) el.innerText = `Total Daily Usage: ${Math.round(total).toLocaleString()} L/day`;
}

function loadDailyUsage(){
  // Reset the legacy stored daily-usage values once so the new app starts at zero.
  const usageVersion = localStorage.getItem("dailyUsageVersion");
  if (usageVersion !== "3") {
    localStorage.removeItem("dailyUsage");
    localStorage.setItem("dailyUsageVersion", "3");
  }

  const saved = JSON.parse(localStorage.getItem("dailyUsage") || "{}");
  usageFields.forEach(name => {
    const input = document.getElementById("usage" + name);
    if(input) input.value = Number.isFinite(Number(saved[name])) ? Math.max(0, Number(saved[name])) : 0;
  });
  updateDailyUsageTotal();
}

function saveDailyUsage(){
  const data = {};
  usageFields.forEach(name => {
    data[name] = parseFloat(document.getElementById("usage" + name).value) || 0;
  });
  localStorage.setItem("dailyUsage", JSON.stringify(data));
  updateDailyUsageTotal();
  updateDailyUsage();
  updateStatus();
  alert("Daily usage saved 👍");
}

usageFields.forEach(name => {
  document.getElementById("usage" + name)?.addEventListener("input", updateDailyUsageTotal);
});

// SETTINGS
const storedTankWidth = localStorage.getItem("tankWidth");
const storedTankHeight = localStorage.getItem("tankHeight");
const storedNumberOfTanks = localStorage.getItem("numberOfTanks");
let tankWidth = storedTankWidth !== null ? (parseFloat(storedTankWidth) || 0) : 0;
let tankHeight = storedTankHeight !== null ? (parseFloat(storedTankHeight) || 0) : 0;
let numberOfTanks = storedNumberOfTanks !== null ? (parseFloat(storedNumberOfTanks) || 0) : 0;
window.tankWidth = tankWidth;
window.tankHeight = tankHeight;
window.numberOfTanks = numberOfTanks;


// TANK VOLUME HELPERS
// One water-level reading applies to every identical tank. Total litres, capacity
// and usage therefore scale directly with the number of tanks.
function getTankCount(){
  return Math.max(0, Math.floor(Number(numberOfTanks) || 0));
}
function getTankRadiusCm(){
  return Math.max(0, Number(tankWidth) || 0) / 20;
}
function getTankHeightCm(){
  return Math.max(0, Number(tankHeight) || 0) / 10;
}
function litresAtLevel(levelMm){
  const count = getTankCount();
  const radius = getTankRadiusCm();
  const heightCm = getTankHeightCm();
  if(count <= 0 || radius <= 0 || heightCm <= 0) return 0;
  const levelCm = Math.min(Math.max(0, Number(levelMm) || 0) / 10, heightCm);
  return Math.PI * radius * radius * levelCm * count / 1000;
}
function totalCapacityLitres(){
  const count = getTankCount();
  const radius = getTankRadiusCm();
  const heightCm = getTankHeightCm();
  if(count <= 0 || radius <= 0 || heightCm <= 0) return 0;
  return Math.PI * radius * radius * heightCm * count / 1000;
}

// CALCULATE
function updateCalculations() {
  const getNum = (id) => {
    const el = document.getElementById(id);
    if (!el) return 0;
    const n = parseFloat(el.value);
    return Number.isFinite(n) ? Math.max(0, n) : 0;
  };

  const tankCount = Math.max(0, Math.floor(Number(numberOfTanks) || 0));
  const configHeight = Math.max(0, Number(window.tankHeight) || 0);
  const configWidth = Math.max(0, Number(window.tankWidth) || 0);
  const waterMm = getNum('waterLevel');

  // One tank capacity. Diameter/width and height are configuration values.
  const oneTankCapacity =
    configHeight > 0 && configWidth > 0
      ? Math.PI * Math.pow(configWidth / 2000, 2) * (configHeight / 1000)
      : 0;

  const totalCapacity = oneTankCapacity * tankCount;

  // Current water level is a physical height. Convert that height to volume
  // for each tank, then total the configured number of tanks.
  const fillRatio =
    configHeight > 0 ? Math.min(1, waterMm / configHeight) : 0;

  // A single water-level reading represents the water volume indicated by
  // that level in one tank. Total storage capacity still includes all tanks.
  const currentLitres =
    oneTankCapacity > 0 ? oneTankCapacity * fillRatio : 0;

  // User-defined meaning of % full:
  // current total water / total storage capacity.
  const percentFull =
    totalCapacity > 0 ? (currentLitres / totalCapacity) * 100 : 0;

  const spaceAvailable = Math.max(0, totalCapacity - currentLitres);

  const usageIds = ['usageShowers','usageToilets','usageLaundry','usageKitchen','usageGarden','usageCleaning','usageOther'];
  const dailyUsage = usageIds.reduce((sum, id) => sum + getNum(id), 0);

  // Forecast is an OUTPUT. It is never hard-coded.
  let daysRemaining = 0;
  let emptyDateText = 'EMPTY APPROX. TODAY';

  if (currentLitres > 0 && dailyUsage > 0) {
    daysRemaining = Math.max(0, Math.ceil(currentLitres / dailyUsage));
    const emptyDate = new Date();
    emptyDate.setHours(12, 0, 0, 0);
    emptyDate.setDate(emptyDate.getDate() + daysRemaining);
    emptyDateText =
      'EMPTY APPROX. ' +
      emptyDate.toLocaleDateString('en-AU', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      }).toUpperCase();
  }

  const setText = (id, value) => {
    const el = document.getElementById(id);
    if (el) el.textContent = value;
  };

  setText('litres', Math.round(currentLitres).toLocaleString('en-AU') + ' L');
  setText('spaceAvailableDisplay', Math.round(spaceAvailable).toLocaleString('en-AU') + ' L');
  setText('totalCapacityDisplay', Math.round(totalCapacity).toLocaleString('en-AU') + ' L');
  setText('dailyUsageDisplay', Math.round(dailyUsage).toLocaleString('en-AU') + ' L');
  setText('daysRemainingDisplay', daysRemaining + ' DAYS REMAINING');
  setText('emptyDateDisplay', emptyDateText);

  // Live tank percentage. Do not rely on a percentage baked into the artwork.
  const pctEl = document.getElementById('tankPercent');
  if (pctEl) {
    pctEl.textContent = percentFull.toFixed(1) + '%';
    pctEl.dataset.percent = percentFull.toFixed(1);
  }

  // Live water fill, if the tank graphic has a water layer.
  const waterEl = document.getElementById('tankWater');
  if (waterEl) {
    waterEl.style.height = Math.max(0, Math.min(100, percentFull)) + '%';
  }

  // Keep the forecast available to any existing UI hooks.
  window.tankCalc = {
    tankCount,
    tankHeight: configHeight,
    tankWidth: configWidth,
    waterMm,
    oneTankCapacity,
    totalCapacity,
    currentLitres,
    percentFull,
    spaceAvailable,
    dailyUsage,
    daysRemaining,
    emptyDateText
  };
}

document.getElementById("waterLevel").addEventListener("input", calculate);
document.getElementById("rainMm")?.addEventListener("input", calculateRain);


// SAVE READING
function animateValue(id, start, end, duration=400){
  let range = end - start;
  let startTime = null;

  function step(timestamp){
    if(!startTime) startTime = timestamp;
    const progress = timestamp - startTime;
    const value = Math.min(start + range * (progress/duration), end);
    document.getElementById(id).innerText =
      Math.floor(value).toLocaleString() + " L";
    if(progress < duration) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function updateDailyUsage(){
  const el = document.getElementById("dailyUsage");
  const manualUsage = getManualDailyUsage();

  if(manualUsage > 0){
    el.innerText = `Using ${Math.round(manualUsage).toLocaleString()} L per day (manual)`;
    document.getElementById("dailyUsageDisplay").innerText = `${Math.round(manualUsage).toLocaleString()} L/day`;
    return;
  }

  let history = JSON.parse(localStorage.getItem("history")) || [];

  if(history.length < 3){
    el.innerText = "";
    document.getElementById("dailyUsageDisplay").innerText = "0 L/day";
    return;
  }

  let totalDrop = 0;
  let days = 0;

  for(let i = 1; i < history.length; i++){
    let diff = history[i-1].level - history[i].level;
    if(diff > 0){
      totalDrop += diff;
      days++;
    }
  }

  if(days === 0){
    el.innerText = "";
    document.getElementById("dailyUsageDisplay").innerText = "0 L/day";
    return;
  }

  const avgDropMm = totalDrop / days;
  const litresPerDay = litresAtLevel(avgDropMm);

  el.innerText = `Using ~${Math.round(litresPerDay).toLocaleString()} L per day (from readings)`;
  document.getElementById("dailyUsageDisplay").innerText = `~${Math.round(litresPerDay).toLocaleString()} L/day`;
}

function saveReading(){
  const level = document.getElementById("waterLevel").value;
  if(level === "" || !Number.isFinite(parseFloat(level))) return alert("Enter a level");

  let history = JSON.parse(localStorage.getItem("history")) || [];
  history.push({date:new Date().toISOString(), level:parseFloat(level)});
  localStorage.setItem("history", JSON.stringify(history));

  calculate();
  alert("Saved 👍");
}
function updateStatus(){
  const history = JSON.parse(localStorage.getItem("history")) || [];
  const el = document.getElementById("statusText");
  const bar = document.getElementById("daysRemainingBar");
  const daysDisplay = document.getElementById("daysRemainingDisplay");
  const dateDisplay = document.getElementById("emptyDateDisplay");

  if(!bar || !daysDisplay || !dateDisplay) return;

  if(el){
    el.classList.remove("status-green","status-orange","status-red","status-animate");
  }

  const manualUsage = getManualDailyUsage();
  let currentLitres = 0;
  let litresPerDay = manualUsage;

  // Current water level is the source of truth for the forecast. Zero is a
  // valid reading and means the tank is empty today.
  const level = Math.max(0, parseFloat(document.getElementById("waterLevel")?.value) || 0);
  const radius = getTankRadiusCm();
  const heightCm = getTankHeightCm();

  if(getTankCount() > 0 && radius > 0 && heightCm > 0){
    const capacityLitres = totalCapacityLitres();
    // The entered water level represents the current water volume indicated
    // by that level in one tank. Total storage capacity includes all tanks.
    const oneTankLitres =
      Math.PI * radius * radius *
      Math.min(Math.max(0, level / 10), heightCm) / 1000;
    currentLitres = Math.max(0, Math.min(capacityLitres, oneTankLitres * getTankCount()));
  }

  // If there is no manual usage, estimate from dated history readings.
  if(!(litresPerDay > 0) && history.length >= 2 && tankWidth > 0 && numberOfTanks > 0){
    let totalDropLitres = 0;
    let elapsedDays = 0;

    for(let i = 1; i < history.length; i++){
      const previous = Number(history[i-1].level);
      const current = Number(history[i].level);
      const previousDate = new Date(history[i-1].date);
      const currentDate = new Date(history[i].date);
      const diffMm = previous - current;

      if(diffMm > 0 && Number.isFinite(previous) && Number.isFinite(current)){
        const dropLitres = litresAtLevel(diffMm);
        const diffDays = (currentDate - previousDate) / 86400000;
        totalDropLitres += dropLitres;
        elapsedDays += diffDays > 0 ? diffDays : 1;
      }
    }

    if(totalDropLitres > 0 && elapsedDays > 0){
      litresPerDay = totalDropLitres / elapsedDays;
    }
  }

  bar.classList.remove("days-green","days-orange","days-red");

  // Zero is a valid output state. Keep the planning panel green and show
  // the actual calculated result: zero days and today's date.
  if(currentLitres <= 0){
    bar.classList.add("days-green");
    daysDisplay.innerText = "0 DAYS REMAINING";
    const today = new Date();
    const dateString = today.toLocaleDateString(undefined,{
      day: "numeric", month: "short", year: "numeric"
    });
    dateDisplay.innerText = `EMPTY APPROX. ${dateString.toUpperCase()}`;
    if(el){
      el.innerText = "Tank empty";
      el.classList.add("status-green");
    }
    return;
  }

  // A non-empty tank needs a positive daily usage figure to forecast its
  // empty date. The green panel remains an output whenever a forecast exists.
  if(litresPerDay > 0){
    const daysLeft = currentLitres / litresPerDay;
    const roundedDays = Math.max(0, Math.ceil(daysLeft));
    const emptyDate = new Date();
    emptyDate.setDate(emptyDate.getDate() + daysLeft);
    const dateString = emptyDate.toLocaleDateString(undefined,{
      day: "numeric", month: "short", year: "numeric"
    });

    if(daysLeft > 30){
      bar.classList.add("days-green");
      if(el){ el.innerText = `Plenty of water\nEmpty around ${dateString}`; el.classList.add("status-green"); }
    } else if(daysLeft >= 14){
      bar.classList.add("days-orange");
      if(el){ el.innerText = `Watch usage\nEmpty around ${dateString}`; el.classList.add("status-orange"); }
    } else {
      bar.classList.add("days-red");
      if(el){ el.innerText = `Action needed\nEmpty around ${dateString}`; el.classList.add("status-red"); }
    }

    daysDisplay.innerText = `${roundedDays} DAYS REMAINING`;
    dateDisplay.innerText = `EMPTY APPROX. ${dateString.toUpperCase()}`;
    return;
  }

  // Not enough information for a non-empty tank: show an instruction rather
  // than pretending there is a forecast.
  bar.classList.add("days-green");
  daysDisplay.innerText = "DAYS REMAINING";
  dateDisplay.innerText = "ADD DAILY USAGE TO ESTIMATE EMPTY DATE";
  if(el){
    el.innerText = "Add daily usage to unlock predictions";
  }
}

// SETTINGS
function openSettings(){
const roof = prompt("Roof catchment area (m²)", localStorage.getItem("roofArea") ?? 0);
if(roof) localStorage.setItem("roofArea", parseFloat(roof));

  const w = prompt("Tank width (mm)", tankWidth);
  const h = prompt("Tank height (mm)", tankHeight);
  const n = prompt("Number of tanks", numberOfTanks);

  if(w !== null && w !== "") tankWidth = Math.max(0, parseFloat(w) || 0);
  if(h !== null && h !== "") tankHeight = Math.max(0, parseFloat(h) || 0);
  if(n !== null && n !== "") numberOfTanks = Math.max(0, Math.floor(parseFloat(n) || 0));

  localStorage.setItem("tankWidth", tankWidth);
  localStorage.setItem("tankHeight", tankHeight);
  localStorage.setItem("numberOfTanks", numberOfTanks);
  window.tankWidth = tankWidth;
  window.tankHeight = tankHeight;
  window.numberOfTanks = numberOfTanks;

  alert("Settings saved");
  calculate();

}

function resetHistory(){
  if(!confirm("Clear all readings and rain data?")) return;

  localStorage.removeItem("history");
  localStorage.removeItem("rain");
  localStorage.removeItem("dailyUsage");

  alert("History cleared");
  location.reload();
}


// NAVIGATION
function showScreen(name){
  document.querySelectorAll(".screen").forEach(s=>s.style.display="none");
  document.getElementById(name).style.display="block";

  // ⭐ ADD THIS
  document.querySelectorAll(".nav button")
    .forEach(b => b.classList.remove("active"));

// INTELLIGENCE + PREDICTION
function loadIntel(){
  let history = JSON.parse(localStorage.getItem("history")) || [];
  const manualUsage = getManualDailyUsage();

  if(manualUsage > 0){
    const level = parseFloat(document.getElementById("waterLevel").value) ||
      (history.length ? history[history.length - 1].level : 0);

    const widthCm = tankWidth / 10;
    const radius = widthCm / 2;
    const currentCm = level / 10;
    const currentLitres =
      (Math.PI * radius * radius * currentCm * numberOfTanks) / 1000;

    if(currentLitres <= 0){
      document.getElementById("intelOutput").innerHTML =
        "Enter today's water level to calculate remaining days.";
      return;
    }

    const daysLeft = currentLitres / manualUsage;
    const emptyDate = new Date();
    emptyDate.setDate(emptyDate.getDate() + daysLeft);

    const dateString = emptyDate.toLocaleDateString(undefined,{
      month: "long",
      day: "numeric"
    });

    document.getElementById("intelOutput").innerHTML = `
      <div>Daily usage: <b>${Math.round(manualUsage).toLocaleString()} L/day</b></div>
      <div>Days remaining: <b>${Math.round(daysLeft)}</b></div>
      <div>Estimated empty: <b>${dateString}</b></div>
      <div style="margin-top:10px;color:var(--sub);">Based on your saved daily usage settings.</div>
    `;
    return;
  }

  if(history.length < 3){
    document.getElementById("intelOutput").innerHTML =
      "Need more readings for prediction, or enter your daily usage above.";
    return;
  }

  let totalDrop = 0;
  let days = 0;

  for(let i = 1; i < history.length; i++){
    let diff = history[i-1].level - history[i].level;
    if(diff > 0){
      totalDrop += diff;
      days++;
    }
  }

  if(days === 0){
    document.getElementById("intelOutput").innerHTML = "Usage unclear.";
    return;
  }

  const avgDropMm = totalDrop / days;
  const widthCm = tankWidth / 10;
  const radius = widthCm / 2;

  const litresPerDay =
    (Math.PI * radius * radius * (avgDropMm / 10) * numberOfTanks) / 1000;

  const currentLevel = history[history.length - 1].level;
  const currentCm = currentLevel / 10;

  const currentLitres =
    (Math.PI * radius * radius * currentCm * numberOfTanks) / 1000;

  const daysLeft = currentLitres / litresPerDay;

  const emptyDate = new Date();
  emptyDate.setDate(emptyDate.getDate() + daysLeft);

  const dateString = emptyDate.toLocaleDateString(undefined,{
    month: "long",
    day: "numeric"
  });

  document.getElementById("intelOutput").innerHTML = `
    <div>Average drop: <b>${avgDropMm.toFixed(1)} mm/day</b></div>
    <div>Usage: <b>${Math.round(litresPerDay).toLocaleString()} L/day</b></div>
    <div>Days remaining: <b>${Math.round(daysLeft)}</b></div>
    <div>Estimated empty: <b>${dateString}</b></div>
  `;
}

// RAIN
function calculateRain(){
  const rain = parseFloat(document.getElementById("rainMm").value) || 0;
  const roofArea = parseFloat(localStorage.getItem("roofArea")) || 0;

  if(!roofArea){
    document.getElementById("rainResult").innerText = "Add roof area in settings";
    return;
  }

  const litresAdded = rain * roofArea;

  let history = JSON.parse(localStorage.getItem("history")) || [];
  if(history.length === 0){
    document.getElementById("rainResult").innerText = "";
    return;
  }

  const widthCm = tankWidth / 10;
  const radius = widthCm / 2;

  const heightCmTotal = tankHeight / 10;
  const capacityLitres = Math.PI * radius * radius * heightCmTotal * numberOfTanks / 1000
;

  const currentLevel = history[history.length - 1].level;
  const currentCm = currentLevel / 10;
  const currentLitres = Math.PI * radius * radius * currentCm * numberOfTanks / 1000
;

  const newLitres = Math.min(capacityLitres, currentLitres + litresAdded);
  const overflow = (currentLitres + litresAdded) - capacityLitres;
  const newPercent = (newLitres / capacityLitres) * 100;

   let message =
  `Rain could add ${Math.round(litresAdded).toLocaleString()} L\n` +
  `Tank would reach ${newPercent.toFixed(1)}%`;

if(overflow > 0){
  message += `\n⚠ Overflow risk: ${Math.round(overflow).toLocaleString()} L`;
}

// estimate extra days using manual daily usage when available,
// otherwise fall back to the reading history.
let litresPerDay = getManualDailyUsage();

if(!litresPerDay){
  let totalDrop = 0;
  let days = 0;

  for(let i = 1; i < history.length; i++){
    let diff = history[i-1].level - history[i].level;
    if(diff > 0){
      totalDrop += diff;
      days++;
    }
  }

  if(days > 0){
    const avgDropMm = totalDrop / days;
    litresPerDay =
      Math.PI * radius * radius * (avgDropMm / 10) * numberOfTanks / 1000;
  }
}

if(litresPerDay > 0){
  const daysGained = litresAdded / litresPerDay;
  message += `\n💧 About ${daysGained.toFixed(1)} extra days of water`;
}

document.getElementById("rainResult").innerText = message;

}
function addRefill(){
  const refill = parseFloat(document.getElementById("refillLitres").value);
  if(!refill) return;

  let history = JSON.parse(localStorage.getItem("history")) || [];
  if(history.length === 0) return;

  const widthCm = tankWidth / 10;
  const radius = widthCm / 2;
  const heightCmTotal = tankHeight / 10;
  const capacityLitres = Math.PI * radius * radius * heightCmTotal * numberOfTanks / 1000;

  const currentLevel = history[history.length - 1].level;
  const currentCm = currentLevel / 10;
  const currentLitres = Math.PI * radius * radius * currentCm * numberOfTanks / 1000;

  const newLitres = Math.min(capacityLitres, currentLitres + refill);

  // convert litres back to mm
  const newCm = newLitres / (Math.PI * radius * radius * numberOfTanks);
  const newMm = newCm * 10;

  history.push({
    date: new Date().toISOString(),
    level: newMm
  });

  localStorage.setItem("history", JSON.stringify(history));

  alert("Refill added 👍");

  updateCalculations(); // refresh numbers
  updateStatus();       // refresh prediction
}
function saveRain(){
  const rain = document.getElementById("rainMm").value;
  if(!rain) return;

  let rainData = JSON.parse(localStorage.getItem("rain")) || [];
  rainData.push({date:new Date().toISOString(), rain:parseFloat(rain)});
  localStorage.setItem("rain", JSON.stringify(rainData));

  alert("Saved 👍");
}

// GRAPH
let chartInstance;
function loadGraph(){
  let history = JSON.parse(localStorage.getItem("history")) || [];
  if(history.length === 0) return;

  const labels = history.map(h=>new Date(h.date).toLocaleDateString());
  const data = history.map(h=>h.level);

  if(chartInstance) chartInstance.destroy();

  const ctx = document.getElementById("chart");

  chartInstance = new Chart(ctx, {
    type:'line',
    data:{
      labels:labels,
      datasets:[{
        label:'Water Level (mm)',
        data:data,
        fill:false,
        tension:0.2
      }]
    }
  });
}

<script id="water-level-bridge">
(function(){
  function syncWaterLevel(){
    const visible = document.getElementById('waterLevelVisible');
    const engine = document.getElementById('waterLevel');
    if(!visible || !engine) return;
    engine.value = visible.value === '' ? '0' : visible.value;
    if(typeof updateCalculations === 'function') updateCalculations();
    if(typeof updateStatus === 'function') updateStatus();
  }

  document.addEventListener('DOMContentLoaded', function(){
    const visible = document.getElementById('waterLevelVisible');
    const engine = document.getElementById('waterLevel');
    if(!visible || !engine) return;

    // The visible field is the single user-facing source of truth.
    visible.value = engine.value || '0';
    visible.addEventListener('input', syncWaterLevel);
    visible.addEventListener('change', syncWaterLevel);

    loadDailyUsage();
    syncWaterLevel();
  });
})();
</script>
